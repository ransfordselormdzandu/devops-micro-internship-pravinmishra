---
- name: Configure Nginx web server
  hosts: webservers
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: true

    - name: Set ownership of /var/www/html for deployment
      file:
        path: /var/www/html
        state: directory
        owner: ubuntu
        group: www-data
        mode: '0755'
        recurse: yes

  handlers:
